version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    # The earlier application is retained only as historical reference.
    # It is not built, executed, deployed, or maintained.
    exclude-paths:
      - "legacy/**"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    exclude-paths:
      - "legacy/**"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
