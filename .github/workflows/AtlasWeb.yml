name: Atlas Web and Storybook

on:
  push:
    paths: ['src/hosts/Atlas.Web/**', '.github/workflows/AtlasWeb.yml']

permissions:
  contents: read

jobs:
  component-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/hosts/Atlas.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/hosts/Atlas.Web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-web-browser-results
          path: |
            src/hosts/Atlas.Web/playwright-report/
            src/hosts/Atlas.Web/test-results/
          retention-days: 7
