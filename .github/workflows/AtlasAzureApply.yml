name: Atlas Azure Terraform apply (manual)

on:
  workflow_dispatch:
    inputs:
      enable_sql_bootstrap:
        description: Temporarily enable SQL bootstrap credentials for both admin WebJobs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: atlas-azure-terraform-apply
  cancel-in-progress: false

jobs:
  azure-plan:
    name: Create the infrastructure plan for review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: atlas-infra-review
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      encrypted_plan_sha256: ${{ steps.encrypt.outputs.sha256 }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure/terraform
        shell: bash
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_name_prefix: ${{ vars.ATLAS_NAME_PREFIX }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_sql_entra_admin_login: ${{ vars.AZURE_SQL_ENTRA_ADMIN_LOGIN }}
      TF_VAR_sql_entra_admin_object_id: ${{ vars.AZURE_SQL_ENTRA_ADMIN_OBJECT_ID }}
      TF_VAR_sql_admin_password: ${{ secrets.TF_SQL_ADMIN_PASSWORD }}
      TF_VAR_demo_seed_password: ${{ secrets.ATLAS_DEMO_PASSWORD }}
      TF_VAR_app_service_sku: "B1"
      TF_VAR_enable_demo: "true"
      TF_VAR_enable_sql_bootstrap: ${{ inputs.enable_sql_bootstrap }}
      TF_BACKEND_RG: ${{ vars.AZURE_TFSTATE_RESOURCE_GROUP }}
      TF_BACKEND_STORAGE: ${{ vars.AZURE_TFSTATE_STORAGE_ACCOUNT }}
      TF_BACKEND_CONTAINER: ${{ vars.AZURE_TFSTATE_CONTAINER }}
      TF_BACKEND_KEY: ${{ vars.AZURE_TFSTATE_KEY }}
    steps:
      - name: Require a fresh run from main
        working-directory: .
        run: |
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_RUN_ATTEMPT" == 1 ]] || {
            echo "::error::Start a new manual run from main."
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Require the configured subscription and private remote state
        run: |
          set -euo pipefail
          for key in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID TF_VAR_name_prefix TF_VAR_location \
            TF_VAR_sql_entra_admin_login TF_VAR_sql_entra_admin_object_id TF_VAR_sql_admin_password \
            TF_BACKEND_RG TF_BACKEND_STORAGE TF_BACKEND_CONTAINER TF_BACKEND_KEY; do
            [[ -n "${!key:-}" ]] || { echo "::error::Missing required GitHub Environment configuration: $key"; exit 1; }
          done
          echo "Azure plan prerequisites supplied; no credentials printed."
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Initialize against private Azure Blob Terraform state
        run: |
          terraform init -no-color -input=false \
            -backend-config="resource_group_name=$TF_BACKEND_RG" \
            -backend-config="storage_account_name=$TF_BACKEND_STORAGE" \
            -backend-config="container_name=$TF_BACKEND_CONTAINER" \
            -backend-config="key=$TF_BACKEND_KEY" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
      - name: Validate Terraform configuration
        run: terraform validate -no-color
      - name: Plan Azure changes
        id: plan
        run: |
          set -euo pipefail
          umask 077
          status=0
          terraform plan -no-color -input=false -lock-timeout=2m -detailed-exitcode -out="$RUNNER_TEMP/atlas.tfplan" || status=$?
          case "$status" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Encrypt the reviewed plan
        id: encrypt
        if: steps.plan.outputs.has_changes == 'true'
        env:
          PLAN_PASSPHRASE: ${{ secrets.ATLAS_TF_PLAN_PASSPHRASE }}
        run: |
          set -euo pipefail
          : "${PLAN_PASSPHRASE:?Configure the plan encryption secret in both environments}"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PLAN_PASSPHRASE \
            -in "$RUNNER_TEMP/atlas.tfplan" -out "$RUNNER_TEMP/atlas.tfplan.enc"
          digest=$(sha256sum "$RUNNER_TEMP/atlas.tfplan.enc" | cut -d ' ' -f 1)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          cp .terraform.lock.hcl "$RUNNER_TEMP/terraform-provider.lock.hcl"
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.has_changes == 'true'
        with:
          name: atlas-encrypted-plan
          path: |
            ${{ runner.temp }}/atlas.tfplan.enc
            ${{ runner.temp }}/terraform-provider.lock.hcl
          if-no-files-found: error
          retention-days: 1
      - name: Remove the plaintext plan
        if: always()
        run: rm -f "$RUNNER_TEMP/atlas.tfplan"

  azure-apply:
    name: Apply the approved Azure infrastructure plan
    needs: azure-plan
    if: needs.azure-plan.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: atlas-infra-apply
    permissions:
      actions: read
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure/terraform
        shell: bash
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_BACKEND_RG: ${{ vars.AZURE_TFSTATE_RESOURCE_GROUP }}
      TF_BACKEND_STORAGE: ${{ vars.AZURE_TFSTATE_STORAGE_ACCOUNT }}
      TF_BACKEND_CONTAINER: ${{ vars.AZURE_TFSTATE_CONTAINER }}
      TF_BACKEND_KEY: ${{ vars.AZURE_TFSTATE_KEY }}
    steps:
      - name: Require a recorded environment approval
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_RUN_ATTEMPT" == 1 ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" |
            jq -e 'any(.[]; .state == "approved" and any(.environments[]; .name == "atlas-infra-apply"))' >/dev/null ||
            { echo "::error::Configure required reviewers on atlas-infra-apply and approve this run."; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - uses: actions/download-artifact@v4
        with:
          name: atlas-encrypted-plan
          path: ${{ runner.temp }}/atlas-plan
      - name: Restore the reviewed provider versions
        run: cp "$RUNNER_TEMP/atlas-plan/terraform-provider.lock.hcl" .terraform.lock.hcl
      - name: Initialize against private Azure Blob Terraform state
        run: |
          terraform init -no-color -input=false -lockfile=readonly \
            -backend-config="resource_group_name=$TF_BACKEND_RG" \
            -backend-config="storage_account_name=$TF_BACKEND_STORAGE" \
            -backend-config="container_name=$TF_BACKEND_CONTAINER" \
            -backend-config="key=$TF_BACKEND_KEY" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
      - name: Apply the reviewed plan
        env:
          PLAN_SHA256: ${{ needs.azure-plan.outputs.encrypted_plan_sha256 }}
          PLAN_PASSPHRASE: ${{ secrets.ATLAS_TF_PLAN_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          : "${PLAN_PASSPHRASE:?Configure the plan encryption secret in both environments}"
          plan_file="$RUNNER_TEMP/atlas.tfplan"
          trap 'rm -f "$plan_file"' EXIT
          encrypted_plan="$RUNNER_TEMP/atlas-plan/atlas.tfplan.enc"
          printf '%s  %s\n' "$PLAN_SHA256" "$encrypted_plan" | sha256sum --check --status
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:PLAN_PASSPHRASE \
            -in "$encrypted_plan" -out "$plan_file"
          terraform apply -no-color -input=false -lock-timeout=2m "$plan_file"
