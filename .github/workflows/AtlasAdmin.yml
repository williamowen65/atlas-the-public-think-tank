name: Atlas admin tools (publish or bootstrap)
run-name: "Admin tools · ${{ inputs.installation }} · ${{ inputs.rehearsal_name || 'profile' }} · ${{ inputs.variant }} · ${{ inputs.operation }}"

on:
  workflow_dispatch:
    inputs:
      rehearsal_name:
        description: "Rehearsal suffix (e.g. trial01); blank uses the tracked rehearsal profile"
        type: string
        required: false
      installation:
        description: "Azure installation (independent of the code branch)"
        type: choice
        required: true
        default: rehearsal
        options:
          - rehearsal
          - main
      variant:
        description: "Target database: live or demo"
        type: choice
        required: true
        options:
          - live
          - demo
      operation:
        description: "Publish SSH tools, or publish and bootstrap SQL identities"
        type: choice
        required: true
        options:
          - publish
          - bootstrap
      confirmation:
        description: "For bootstrap only: type bootstrap-live or bootstrap-demo"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: atlas-admin-${{ inputs.installation }}-${{ inputs.variant }}
  cancel-in-progress: false

jobs:
  validate-target:
    name: Resolve tracked deployment target
    outputs:
      name_prefix: ${{ steps.target.outputs.name_prefix }}
      state_key: ${{ steps.target.outputs.state_key }}
      resource_group: ${{ steps.target.outputs.resource_group }}
      live_app: ${{ steps.target.outputs.live_app }}
      demo_app: ${{ steps.target.outputs.demo_app }}
      live_admin: ${{ steps.target.outputs.live_admin }}
      demo_admin: ${{ steps.target.outputs.demo_admin }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve installation selection
        id: target
        env:
          ATLAS_INSTALLATION: ${{ inputs.installation }}
          ATLAS_REHEARSAL_NAME: ${{ inputs.rehearsal_name }}
        run: python infrastructure/scripts/check-deployment-target.py selection

  package:
    needs: validate-target
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build dedicated Atlas.Admin .NET maintenance executable
        run: dotnet publish src/hosts/Atlas.Admin/Atlas.Admin.csproj --configuration Release --output "$RUNNER_TEMP/atlas-admin-publish"
      - name: Package SSH tools and the identity bootstrap job
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/admin-package"
          tools="$root/tools/atlas-admin"
          job="$root/App_Data/jobs/triggered/atlas-bootstrap"
          mkdir -p "$tools" "$job"
          cp -a "$RUNNER_TEMP/atlas-admin-publish/." "$tools/"
          cp -a "$RUNNER_TEMP/atlas-admin-publish/." "$job/"
          cp infrastructure/webjobs/run-webjob.sh "$job/run.sh"
          chmod +x "$job/run.sh"
          cd "$root"
          zip -qr "$RUNNER_TEMP/atlas-admin-tools.zip" .
          unzip -l "$RUNNER_TEMP/atlas-admin-tools.zip" | grep 'tools/atlas-admin/Atlas.Admin.dll'
          unzip -l "$RUNNER_TEMP/atlas-admin-tools.zip" | grep 'App_Data/jobs/triggered/atlas-bootstrap/run.sh'
          ! unzip -l "$RUNNER_TEMP/atlas-admin-tools.zip" | grep -q '/Atlas.Console.dll'
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-admin-tools
          path: ${{ runner.temp }}/atlas-admin-tools.zip
          retention-days: 2

  execute:
    needs: [package, validate-target]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: atlas-infra-apply
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify installation app target
        env:
          ATLAS_INSTALLATION: ${{ inputs.installation }}
          ATLAS_REHEARSAL_NAME: ${{ inputs.rehearsal_name }}
          ATLAS_VARIANT: ${{ inputs.variant }}
          ATLAS_TARGET_APP: ${{ inputs.variant == 'live' && needs.validate-target.outputs.live_admin || needs.validate-target.outputs.demo_admin }}
          AZURE_RESOURCE_GROUP: ${{ needs.validate-target.outputs.resource_group }}
        run: python infrastructure/scripts/check-deployment-target.py admin
      - name: Verify explicit operation and target
        shell: bash
        env:
          VARIANT: ${{ inputs.variant }}
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$VARIANT" == "live" || "$VARIANT" == "demo" ]] || { echo "Unknown variant"; exit 1; }
          case "$OPERATION" in
            publish) ;;
            bootstrap)
              [[ "$CONFIRMATION" == "bootstrap-$VARIANT" ]] || { echo "Bootstrap requires exact environment confirmation"; exit 1; }
              ;;
            *) echo "Unknown operation"; exit 1 ;;
          esac
      - uses: actions/download-artifact@v4
        with:
          name: atlas-admin-tools
          path: ./admin-package
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publish admin tools
        shell: bash
        env:
          ADMIN_APP: ${{ inputs.variant == 'live' && needs.validate-target.outputs.live_admin || needs.validate-target.outputs.demo_admin }}
          RESOURCE_GROUP: ${{ needs.validate-target.outputs.resource_group }}
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          : "${ADMIN_APP:?Selected profile did not resolve an admin app}"
          : "${RESOURCE_GROUP:?Selected profile did not resolve a resource group}"
          # Clean deployment is allowed only on the dedicated admin host naming
          # convention produced by Terraform, never on a public website target.
          [[ "$ADMIN_APP" == *-"$VARIANT"-ops ]] || { echo "Expected a dedicated admin App Service"; exit 1; }
          # Verify the target App Service's protected configuration, not just its name.
          actual_variant="$(az webapp config appsettings list --name "$ADMIN_APP" --resource-group "$RESOURCE_GROUP" --query "[?name=='ATLAS_DEPLOYMENT_VARIANT'].value | [0]" -o tsv)"
          [[ "$actual_variant" == "$VARIANT" ]] || { echo "Admin site variant mismatch"; exit 1; }
          # This host contains only maintenance tools. Clean deployment removes
          # obsolete diagnostic/schema/seed WebJobs from earlier packages.
          az webapp deploy --name "$ADMIN_APP" --resource-group "$RESOURCE_GROUP" --src-path ./admin-package/atlas-admin-tools.zip --type zip --clean true --async false --track-status false
          {
            echo "### Admin tools published: $VARIANT"
            echo 'Open the matching admin App Service SSH terminal.'
            echo 'Tool directory: `/home/site/wwwroot/tools/atlas-admin`'
            echo "Moderator: \`dotnet ./Atlas.Admin.dll --grant-global-moderator EMAIL grant-$VARIANT\`"
            echo 'Schema: `dotnet ./Atlas.Admin.dll --setup-database`'
            if [[ "$VARIANT" == "demo" ]]; then
              echo 'After schema succeeds, seed an empty demo: `dotnet ./Atlas.Admin.dll --seed-demo`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Bootstrap SQL identities and verify completion
        if: ${{ inputs.operation == 'bootstrap' }}
        shell: bash
        env:
          ATLAS_ADMIN_JOB: atlas-bootstrap
          ATLAS_ADMIN_SITE: ${{ inputs.variant == 'live' && needs.validate-target.outputs.live_admin || needs.validate-target.outputs.demo_admin }}
          ATLAS_ADMIN_RG: ${{ needs.validate-target.outputs.resource_group }}
          ATLAS_ADMIN_SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          export ATLAS_TRIGGER_STARTED="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          az webapp webjob triggered run --name "$ATLAS_ADMIN_SITE" --resource-group "$ATLAS_ADMIN_RG" --webjob-name "$ATLAS_ADMIN_JOB"
          python infrastructure/scripts/wait-for-webjob.py
      - name: Remind operator to revoke bootstrap credentials
        if: ${{ inputs.operation == 'bootstrap' && success() }}
        run: echo "::warning::Set enable_sql_bootstrap=false and manually terraform apply immediately to remove transient SQL administrator settings from the admin hosts."
