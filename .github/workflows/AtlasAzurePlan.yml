name: Atlas Azure Terraform plan (manual, no apply)
run-name: "Terraform plan · ${{ inputs.installation }} · ${{ inputs.rehearsal_name || 'profile' }} · apps=${{ inputs.deployment_shape }} · branch=${{ github.ref_name }}"

# A live preview against the intended Azure subscription and the PRIVATE
# remote state. This workflow NEVER applies infrastructure or uploads a plan
# file. Do not run on PRs: Azure credentials/state access stay environment-gated.
on:
  workflow_dispatch:
    inputs:
      deployment_shape:
        description: "Applications: default = main both, rehearsal live only"
        type: choice
        required: true
        default: default
        options:
          - default
          - live
          - demo
          - both
      rehearsal_name:
        description: "Rehearsal suffix (e.g. trial01); blank uses the tracked rehearsal profile"
        type: string
        required: false
      installation:
        description: "Azure installation (independent of the code branch)"
        type: choice
        required: true
        default: rehearsal
        options:
          - rehearsal
          - main

permissions:
  contents: read

jobs:
  validate-target:
    name: Resolve tracked deployment target
    outputs:
      name_prefix: ${{ steps.target.outputs.name_prefix }}
      state_key: ${{ steps.target.outputs.state_key }}
      variants_json: ${{ steps.target.outputs.variants_json }}
      terraform_demo_only: ${{ steps.target.outputs.terraform_demo_only }}
      resource_group: ${{ steps.target.outputs.resource_group }}
      live_app: ${{ steps.target.outputs.live_app }}
      demo_app: ${{ steps.target.outputs.demo_app }}
      live_admin: ${{ steps.target.outputs.live_admin }}
      demo_admin: ${{ steps.target.outputs.demo_admin }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve installation selection
        id: target
        env:
          ATLAS_TARGET_PURPOSE: infrastructure
          ATLAS_INSTALLATION: ${{ inputs.installation }}
          ATLAS_REHEARSAL_NAME: ${{ inputs.rehearsal_name }}
          ATLAS_DEPLOYMENT_SHAPE: ${{ inputs.deployment_shape }}
        run: python infrastructure/scripts/check-deployment-target.py selection

  azure-plan:
    needs: validate-target
    name: Read-only Azure infrastructure preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: atlas-infra-apply
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure/terraform
        shell: bash
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_name_prefix: ${{ needs.validate-target.outputs.name_prefix }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_sql_entra_admin_login: ${{ vars.AZURE_SQL_ENTRA_ADMIN_LOGIN }}
      TF_VAR_sql_entra_admin_object_id: ${{ vars.AZURE_SQL_ENTRA_ADMIN_OBJECT_ID }}
      TF_VAR_sql_admin_password: ${{ secrets.TF_SQL_ADMIN_PASSWORD }}
      TF_VAR_demo_seed_password: ${{ secrets.ATLAS_DEMO_PASSWORD }}
      TF_VAR_account_mail_enabled: ${{ vars.ATLAS_MAIL_ENABLED || 'false' }}
      TF_VAR_account_mail_host: ${{ vars.ATLAS_MAIL_HOST || 'mail.privateemail.com' }}
      TF_VAR_account_mail_port: ${{ vars.ATLAS_MAIL_PORT || '587' }}
      TF_VAR_account_mail_address: ${{ vars.ATLAS_MAIL_ADDRESS }}
      TF_VAR_account_mail_password: ${{ secrets.ATLAS_MAIL_PASSWORD }}
      TF_VAR_account_mail_public_origins: ${{ vars.ATLAS_MAIL_PUBLIC_ORIGINS || '{}' }}
      TF_VAR_app_service_sku: "B1"
      TF_VAR_deployment_variants: ${{ needs.validate-target.outputs.variants_json }}
      ATLAS_VARIANTS_JSON: ${{ needs.validate-target.outputs.variants_json }}
      # Review only, never activate a temporary privileged SQL bootstrap here.
      TF_VAR_enable_sql_bootstrap: "false"
      TF_BACKEND_RG: ${{ vars.AZURE_TFSTATE_RESOURCE_GROUP }}
      TF_BACKEND_STORAGE: ${{ vars.AZURE_TFSTATE_STORAGE_ACCOUNT }}
      TF_BACKEND_CONTAINER: ${{ vars.AZURE_TFSTATE_CONTAINER }}
      TF_BACKEND_KEY: ${{ needs.validate-target.outputs.state_key || vars.AZURE_TFSTATE_KEY }}
      ATLAS_TERRAFORM_DEMO_ONLY: ${{ needs.validate-target.outputs.terraform_demo_only }}
      ATLAS_INSTALLATION: ${{ inputs.installation }}
      ATLAS_REHEARSAL_NAME: ${{ inputs.rehearsal_name }}
      ATLAS_DEPLOYMENT_SHAPE: ${{ inputs.deployment_shape }}
      ATLAS_NAME_PREFIX: ${{ needs.validate-target.outputs.name_prefix }}
      AZURE_TFSTATE_KEY: ${{ needs.validate-target.outputs.state_key || vars.AZURE_TFSTATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify installation namespace and state key
        working-directory: .
        run: python infrastructure/scripts/check-deployment-target.py infrastructure
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Require the configured subscription and private remote state
        run: |
          set -euo pipefail
          for key in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID TF_VAR_name_prefix TF_VAR_location \
            TF_VAR_sql_entra_admin_login TF_VAR_sql_entra_admin_object_id TF_VAR_sql_admin_password \
            TF_BACKEND_RG TF_BACKEND_STORAGE TF_BACKEND_CONTAINER TF_BACKEND_KEY; do
            [[ -n "${!key:-}" ]] || { echo "::error::Missing required GitHub Environment configuration: $key"; exit 1; }
          done
          echo "Azure plan prerequisites supplied; no credentials printed."
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Initialize against private Azure Blob Terraform state
        run: |
          terraform init -no-color -input=false \
            -backend-config="resource_group_name=$TF_BACKEND_RG" \
            -backend-config="storage_account_name=$TF_BACKEND_STORAGE" \
            -backend-config="container_name=$TF_BACKEND_CONTAINER" \
            -backend-config="key=$TF_BACKEND_KEY" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
      - name: Validate Terraform configuration
        run: terraform validate -no-color
      - name: Reject removal of an existing application variant
        run: |
          set -euo pipefail
          terraform show -json | python ../scripts/check-terraform-changes.py state
      - name: Review proposed Azure changes — NEVER apply
        run: |
          set -euo pipefail
          umask 077
          preview_plan="$RUNNER_TEMP/atlas-preview.tfplan"
          trap 'rm -f "$preview_plan"' EXIT
          # Inspect a private temporary plan; never upload or print its JSON.
          exit_code=0
          scope_args=()
          if [[ "${ATLAS_TERRAFORM_DEMO_ONLY:-false}" == "true" ]]; then
            scope_args+=('-target=module.sites["demo"]')
          fi
          terraform plan "${scope_args[@]}" -no-color -input=false -lock-timeout=2m -detailed-exitcode -out="$preview_plan" || exit_code=$?
          if [[ "$exit_code" -ne 0 && "$exit_code" -ne 2 ]]; then
            echo "::error::Azure-connected Terraform planning failed."
            exit "$exit_code"
          fi
          terraform show -json "$preview_plan" | python ../scripts/check-terraform-changes.py plan
          if [[ "$exit_code" -eq 0 ]]; then
            echo "No infrastructure changes proposed."
            exit 0
          fi
          if [[ "$exit_code" -eq 2 ]]; then
            echo "::notice::Terraform proposed infrastructure changes. Review this workflow log before running any separate manual apply."
            exit 0
          fi
          echo "::error::Azure-connected Terraform planning failed."
          exit "$exit_code"
