name: Atlas Rewrite Tests

on:
  push:
    branches:
      - main
      - 'PTT-*'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Atlas.Console.Tests/**'
      - 'Atlas.sln'
      - '.github/workflows/AtlasRewriteTests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Atlas.Console.Tests/**'
      - 'Atlas.sln'
      - '.github/workflows/AtlasRewriteTests.yml'
  workflow_dispatch:

jobs:
  test-rewrite:
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Graph
            project: tests/Atlas.Graph.Tests/Atlas.Graph.Tests.csproj
          - name: Participants
            project: tests/Atlas.Participants.Tests/Atlas.Participants.Tests.csproj
          - name: Voting
            project: tests/Atlas.Voting.Tests/Atlas.Voting.Tests.csproj
          - name: Console JSON adapters
            project: tests/Atlas.Console.Tests/Atlas.Console.Tests.csproj

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore ${{ matrix.name }}
        run: dotnet restore "${{ matrix.project }}"

      - name: Test ${{ matrix.name }}
        run: >-
          dotnet test "${{ matrix.project }}"
          --configuration Release
          --no-restore
          --verbosity normal
