name: Atlas Rewrite Tests

on:
  push:
    branches:
      - main
      - 'PTT-*'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Atlas.Console.Tests/**'
      - 'Atlas.sln'
      - '.github/workflows/AtlasRewriteTests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Atlas.Console.Tests/**'
      - 'Atlas.sln'
      - '.github/workflows/AtlasRewriteTests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-rewrite:
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Graph
            project: tests/Atlas.Graph.Tests/Atlas.Graph.Tests.csproj
          - name: Participants
            project: tests/Atlas.Participants.Tests/Atlas.Participants.Tests.csproj
          - name: Identity
            project: tests/Atlas.Identity.Tests/Atlas.Identity.Tests.csproj
          - name: Voting
            project: tests/Atlas.Voting.Tests/Atlas.Voting.Tests.csproj
          - name: Communities
            project: tests/Atlas.Communities.Tests/Atlas.Communities.Tests.csproj
          - name: Comments
            project: tests/Atlas.Comments.Tests/Atlas.Comments.Tests.csproj
          - name: Console
            project: tests/Atlas.Console.Tests/Atlas.Console.Tests.csproj
          - name: Moderation
            project: tests/Atlas.Moderation.Tests/Atlas.Moderation.Tests.csproj
          - name: Notifications
            project: tests/Atlas.Notifications.Tests/Atlas.Notifications.Tests.csproj
          - name: EF persistence contracts
            project: tests/Atlas.Persistence.Tests/Atlas.Persistence.Tests.csproj
          - name: Discovery
            project: tests/Atlas.Discovery.Tests/Atlas.Discovery.Tests.csproj

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore ${{ matrix.name }}
        run: dotnet restore "${{ matrix.project }}"

      - name: Test ${{ matrix.name }}
        run: >-
          dotnet test "${{ matrix.project }}"
          --configuration Release
          --no-restore
          --verbosity normal

  test-sql-server:
    name: SQL Server ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Persistence
            project: tests/Atlas.Persistence.Tests/Atlas.Persistence.Tests.csproj
          - name: Identity
            project: tests/Atlas.Identity.Tests/Atlas.Identity.Tests.csproj
          - name: Console
            project: tests/Atlas.Console.Tests/Atlas.Console.Tests.csproj
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Atlas_CI_Only_29!Password
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Atlas_CI_Only_29!Password' -C -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      ATLAS_SQL_TEST_CONNECTION_STRING: Server=localhost,1433;User ID=sa;Password=Atlas_CI_Only_29!Password;TrustServerCertificate=True;Encrypt=True
      ATLAS_SQL_CONNECTION_STRING: Server=localhost,1433;User ID=sa;Password=Atlas_CI_Only_29!Password;TrustServerCertificate=True;Encrypt=True
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check migrations match the EF model
        run: |
          dotnet tool restore
          dotnet restore src/Atlas.Persistence/Atlas.Persistence.csproj
          dotnet ef migrations has-pending-model-changes --project src/Atlas.Persistence
      - name: Test ${{ matrix.name }} against SQL Server
        run: dotnet test "${{ matrix.project }}" --configuration Release --verbosity normal
