name: Atlas Rewrite Tests

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Atlas.Console.Tests/**'
      - 'Atlas.sln'
      - '.config/dotnet-tools.json'
      - '.github/workflows/AtlasRewriteTests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Atlas.Console.Tests/**'
      - 'Atlas.sln'
      - '.config/dotnet-tools.json'
      - '.github/workflows/AtlasRewriteTests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ranking-lab:
    name: Validate isolated Ranking Lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/hosts/Atlas.RankingLab/Atlas.RankingLab.csproj --configuration Release
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/hosts/Atlas.Web/package-lock.json
      - run: npm ci
        working-directory: src/hosts/Atlas.Web
      - run: npm run check && npm run build-storybook
        working-directory: src/hosts/Atlas.Web
      - run: npx playwright install --with-deps chromium
        working-directory: src/hosts/Atlas.Web
      - run: npx playwright test --config playwright.ranking.config.ts
        working-directory: src/hosts/Atlas.Web

  test-rewrite:
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            project: tests/Atlas.Api.Tests/Atlas.Api.Tests.csproj
          - name: Application
            project: tests/Atlas.Application.Tests/Atlas.Application.Tests.csproj
          - name: Graph
            project: tests/Atlas.Graph.Tests/Atlas.Graph.Tests.csproj
          - name: Participants
            project: tests/Atlas.Participants.Tests/Atlas.Participants.Tests.csproj
          - name: Identity
            project: tests/Atlas.Identity.Tests/Atlas.Identity.Tests.csproj
          - name: Voting
            project: tests/Atlas.Voting.Tests/Atlas.Voting.Tests.csproj
          - name: Communities
            project: tests/Atlas.Communities.Tests/Atlas.Communities.Tests.csproj
          - name: Comments
            project: tests/Atlas.Comments.Tests/Atlas.Comments.Tests.csproj
          - name: Console
            project: tests/Atlas.Console.Tests/Atlas.Console.Tests.csproj
          - name: Moderation
            project: tests/Atlas.Moderation.Tests/Atlas.Moderation.Tests.csproj
          - name: Notifications
            project: tests/Atlas.Notifications.Tests/Atlas.Notifications.Tests.csproj
          - name: EF persistence contracts
            project: tests/Atlas.Persistence.Tests/Atlas.Persistence.Tests.csproj
          - name: Discovery
            project: tests/Atlas.Discovery.Tests/Atlas.Discovery.Tests.csproj

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore ${{ matrix.name }}
        run: dotnet restore "${{ matrix.project }}"

      - name: Test ${{ matrix.name }}
        run: >-
          dotnet test "${{ matrix.project }}"
          --configuration Release
          --no-restore
          --verbosity normal

  test-sql-server:
    name: SQL Server ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API fresh model
            project: tests/Atlas.Api.Tests/Atlas.Api.Tests.csproj
          - name: Discovery read model
            project: tests/Atlas.Persistence.Tests/Atlas.Persistence.Tests.csproj
            filter: '--filter FullyQualifiedName~Discovery'
          - name: Audit fresh model
            project: tests/Atlas.Persistence.Tests/Atlas.Persistence.Tests.csproj
            filter: '--filter FullyQualifiedName~SqlAuditTests'
          - name: Voting quota fresh model
            project: tests/Atlas.Persistence.Tests/Atlas.Persistence.Tests.csproj
            filter: '--filter FullyQualifiedName~SqlVoteActionQuotaTests'
          - name: Community quota fresh model
            project: tests/Atlas.Persistence.Tests/Atlas.Persistence.Tests.csproj
            filter: '--filter FullyQualifiedName~SqlCommunityCreationQuotaTests'
          - name: Report quota fresh model
            project: tests/Atlas.Persistence.Tests/Atlas.Persistence.Tests.csproj
            filter: '--filter FullyQualifiedName~SqlReportSubmissionQuotaTests'
          - name: Comment paging fresh model
            project: tests/Atlas.Persistence.Tests/Atlas.Persistence.Tests.csproj
            filter: '--filter FullyQualifiedName~SqlCommentPagingTests'
          - name: Persistence
            project: tests/Atlas.Persistence.Tests/Atlas.Persistence.Tests.csproj
          - name: Identity
            project: tests/Atlas.Identity.Tests/Atlas.Identity.Tests.csproj
          - name: Console
            project: tests/Atlas.Console.Tests/Atlas.Console.Tests.csproj
    env:
      ATLAS_SQL_TEST_CONNECTION_STRING: Server=localhost,1433;User ID=sa;Password=Atlas_CI_Only_29!Password;TrustServerCertificate=True;Encrypt=True
      ATLAS_SQL_CONNECTION_STRING: Server=localhost,1433;User ID=sa;Password=Atlas_CI_Only_29!Password;TrustServerCertificate=True;Encrypt=True
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build SQL Server with matching Full-Text Search package
        uses: docker/build-push-action@v7
        with:
          context: tests/infrastructure/sqlserver
          load: true
          tags: atlas-sql-fts:ci
          cache-from: type=gha,scope=atlas-sql-fts
          cache-to: type=gha,mode=max,scope=atlas-sql-fts
      - name: Start SQL Server and require full-text English support
        run: |
          docker run -d --name atlas-sql -p 1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD='Atlas_CI_Only_29!Password' atlas-sql-fts:ci
          ready=false
          for attempt in {1..60}; do
            if docker exec atlas-sql /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P 'Atlas_CI_Only_29!Password' -C -b \
              -Q "IF COALESCE(FULLTEXTSERVICEPROPERTY('IsFullTextInstalled'), 0) <> 1 THROW 51000, 'Full-text is not installed', 1; IF NOT EXISTS (SELECT 1 FROM sys.fulltext_languages WHERE lcid = 1033) THROW 51000, 'English full-text resources are missing', 1;"; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then docker logs atlas-sql; exit 1; fi
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Check migrations match the EF model
        if: matrix.name != 'API fresh model' && matrix.name != 'Discovery read model' && matrix.name != 'Audit fresh model' && matrix.name != 'Voting quota fresh model' && matrix.name != 'Community quota fresh model' && matrix.name != 'Report quota fresh model' && matrix.name != 'Comment paging fresh model'
        run: |
          dotnet tool restore
          dotnet restore src/Atlas.Persistence/Atlas.Persistence.csproj
          dotnet ef migrations has-pending-model-changes --project src/Atlas.Persistence
      - name: Test ${{ matrix.name }} against SQL Server
        run: dotnet test "${{ matrix.project }}" --configuration Release --verbosity normal ${{ matrix.filter }}

      - name: Upload Discovery SQL performance evidence
        if: matrix.name == 'Discovery read model' && always()
        uses: actions/upload-artifact@v7
        with:
          name: discovery-sql-evidence
          path: tests/Atlas.Persistence.Tests/TestResults/discovery-*
          if-no-files-found: ignore

      - name: SQL Server failure diagnostics
        if: failure()
        run: docker logs atlas-sql || true
      - name: Stop SQL Server
        if: always()
        run: docker rm -f atlas-sql || true
