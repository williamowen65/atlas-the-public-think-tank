name: Grant Atlas globe bootstrap Reader
on:
  workflow_dispatch:
    inputs:
      installation:
        type: choice
        options: [rehearsal, main]
        default: rehearsal
      rehearsal_name:
        description: Rehearsal suffix (blank uses the tracked profile)
        type: string

permissions:
  contents: read

jobs:
  grant-reader:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: atlas-globe-worker-access-admin
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve deployment resource group
        id: target
        env:
          ATLAS_INSTALLATION: ${{ inputs.installation }}
          ATLAS_REHEARSAL_NAME: ${{ inputs.rehearsal_name }}
        run: python3 infrastructure/scripts/check-deployment-target.py selection
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Grant Reader to the globe bootstrap identity
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ steps.target.outputs.resource_group }}
          BOOTSTRAP_PRINCIPAL_ID: ${{ vars.AZURE_GLOBE_BOOTSTRAP_PRINCIPAL_ID }}
        run: |
          set -euo pipefail
          if [[ ! "$BOOTSTRAP_PRINCIPAL_ID" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]; then
            echo "::error::Set AZURE_GLOBE_BOOTSTRAP_PRINCIPAL_ID to the bootstrap service principal object ID."
            exit 1
          fi
          scope="$(az group show --subscription "$SUBSCRIPTION_ID" --name "$RESOURCE_GROUP" --query id -o tsv)"
          reader_role="acdd72a7-3385-48ef-bd42-f606fba81ae7"
          az role assignment create --subscription "$SUBSCRIPTION_ID" \
            --scope "$scope" --role "$reader_role" \
            --assignee-object-id "$BOOTSTRAP_PRINCIPAL_ID" \
            --assignee-principal-type ServicePrincipal --output none
          echo "Reader is assigned to the globe bootstrap identity on $RESOURCE_GROUP."
