name: Contribution proposal
description: Propose a focused improvement or contribution opportunity
title: "[Proposal]: "
labels:
  - enhancement
  - needs-discussion
body:
  - type: markdown
    attributes:
      value: |
        GitHub Issues are Atlas's public proposal and contribution backlog. Jira is used separately for work Atlas has committed to deliver. Please describe the problem before prescribing a large implementation.

  - type: textarea
    id: problem
    attributes:
      label: What problem should Atlas solve?
      description: Explain the user, contributor, or system need.
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: Who benefits, and how?
      description: Describe the value and any fairness, transparency, accessibility, or privacy implications.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: Describe a focused approach. It is fine to leave implementation details open.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Likely affected area
      options:
        - Graph
        - Content
        - Participants
        - Voting
        - Communities
        - Comments
        - Discovery
        - Moderation
        - Contracts
        - Console
        - Documentation
        - Tests or build
        - New or cross-cutting area
        - Unsure
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance criteria
      description: What behavior or outcome would show that the contribution is complete?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Testing, documentation, and platform impact
      description: Note likely tests, requirements, ADRs, domain documentation, Console workflows, API/UI implications, or migration concerns.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds did you consider?

  - type: dropdown
    id: involvement
    attributes:
      label: Would you like to work on this?
      options:
        - "Yes"
        - "Maybe, with guidance"
        - "No; I am proposing it for others"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched Discussions and Issues for an existing proposal.
          required: true
        - label: I understand that this proposal is not committed delivery work unless Atlas accepts and prioritizes it.
          required: true
        - label: I will wait for the `contribution-ready` label before beginning a substantial implementation.
          required: true
